{{define "content"}}
<div class="flex-between" style="margin-bottom:16px;">
  <h2 style="margin:0;">Customers ({{ len .Customers }})</h2>
  <form method="get" style="display:flex; gap:8px;">
    <input name="q" value="{{ .Q }}" placeholder="Search">
    <button class="secondary">Search</button>
  </form>
</div>
<div class="card" style="padding:0;">
<table>
  <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>License</th><th>Expiry</th></tr></thead>
  <tbody>
    {{ range .Customers }}
    <tr>
      <td><strong>{{ .FirstName }} {{ .LastName }}</strong></td>
      <td class="muted">{{ or .Email "—" }}</td>
      <td class="muted">{{ or .Phone "—" }}</td>
      <td class="muted" style="font-family: monospace;">{{ or .LicenseNumber "—" }}</td>
      <td class="muted">{{ or .LicenseExpiry "—" }}</td>
    </tr>
    {{ else }}
    <tr><td colspan="5" class="muted" style="text-align:center; padding: 40px;">No customers.</td></tr>
    {{ end }}
  </tbody>
</table>
</div>
{{end}}
