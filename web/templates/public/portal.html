{{define "content"}}
<section class="container">
  <div class="flex-between" style="margin-bottom: 16px;">
    <h2 style="margin: 0;">My bookings</h2>
    <form action="/portal/logout" method="post"><button class="secondary small">Sign out</button></form>
  </div>
  <div class="card" style="padding:0;">
    <table>
      <thead><tr><th>Booking</th><th>Vehicle</th><th>Pickup</th><th>Return</th><th>Total</th><th>Status</th></tr></thead>
      <tbody>
        {{ range .Bookings }}
        <tr>
          <td><strong>{{ .BookingNumber }}</strong></td>
          <td>{{ .Vehicle }}</td>
          <td class="muted">{{ fmtTime .PickupAt }}</td>
          <td class="muted">{{ fmtTime .ReturnAt }}</td>
          <td>${{ dollars .TotalCents }}</td>
          <td><span class="badge {{ statusClass .Status }}">{{ .Status }}</span></td>
        </tr>
        {{ else }}
        <tr><td colspan="6" class="muted" style="text-align:center; padding: 40px;">No bookings yet.</td></tr>
        {{ end }}
      </tbody>
    </table>
  </div>
</section>
{{end}}
