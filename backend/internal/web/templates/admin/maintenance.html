{{define "content"}}
<h2>Maintenance</h2>
{{ if .Flash }}<div class="ok">{{ .Flash }}</div>{{ end }}

<div class="row">
  <div class="card" style="padding:0;">
    <h3 style="padding:16px 16px 0;">Service records</h3>
    <table>
      <thead><tr><th>Date</th><th>Vehicle</th><th>Kind</th><th>Cost</th><th>Vendor</th></tr></thead>
      <tbody>
        {{ range .Records }}
        <tr><td class="muted">{{ .PerformedOn }}</td><td>{{ .Vehicle }}</td><td>{{ .Kind }}</td><td>${{ dollars .CostCents }}</td><td class="muted">{{ or .Vendor "—" }}</td></tr>
        {{ else }}
        <tr><td colspan="5" class="muted" style="text-align:center; padding:20px;">None.</td></tr>
        {{ end }}
      </tbody>
    </table>
  </div>

  <form method="post" action="/admin/maintenance" class="card">
    <h3>Log maintenance</h3>
    <label>Vehicle</label>
    <select name="vehicleId" required>
      <option value="">Select…</option>
      {{ range .Vehicles }}<option value="{{ .ID }}">{{ .Year }} {{ .Make }} {{ .Model }}</option>{{ end }}
    </select>
    <label>Kind</label>
    <select name="kind"><option>service</option><option>oil_change</option><option>tires</option><option>brakes</option><option>inspection</option></select>
    <label>Description</label><input name="description">
    <label>Cost (cents)</label><input type="number" name="costCents" value="0">
    <label>Vendor</label><input name="vendor">
    <label>Performed on</label><input type="date" name="performedOn" value="{{ .Today }}">
    <button style="margin-top: 12px;">Save</button>
  </form>
</div>
{{end}}
